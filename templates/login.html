<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Live · Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen px-4" style="font-family: 'Space Mono', monospace;">
    <div class="w-full max-w-sm bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-[0_0_30px_rgba(34,211,238,0.1)]">
        <h1 class="text-2xl font-bold text-white">Wallet<span class="text-cyan-400">Live</span></h1>
        <p class="text-white/50 text-sm mt-1 mb-6">Sua carteira de investimentos em Rust.</p>

        {% if let Some(error) = error %}
        <div role="alert" class="mb-5 px-4 py-3 rounded-xl border border-rose-400/30 bg-rose-500/10 text-rose-300 text-sm">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="flex flex-col gap-5">
            <input
                type="text"
                name="username"
                placeholder="usuário"
                required
                minlength="3"
                maxlength="32"
                autocomplete="username"
                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 focus:outline-none focus:border-cyan-400/50 focus:shadow-[0_0_15px_rgba(34,211,238,0.2)] transition-all duration-300"
            >
            <input
                type="password"
                name="password"
                placeholder="senha"
                required
                minlength="6"
                autocomplete="current-password"
                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-white/30 focus:outline-none focus:border-cyan-400/50 focus:shadow-[0_0_15px_rgba(34,211,238,0.2)] transition-all duration-300"
            >
            <button type="submit" class="px-4 py-3 bg-cyan-500/20 border border-cyan-400/30 rounded-xl text-cyan-400 font-medium hover:bg-cyan-500/30 hover:shadow-[0_0_20px_rgba(34,211,238,0.3)] active:bg-cyan-500/40 transition-all duration-300">entrar</button>
        </form>
        <p class="text-white/40 text-xs mt-6">Primeira vez aqui? Escolha um usuário e uma senha: sua conta é criada no primeiro acesso.</p>
    </div>
</body>
</html>
